name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
  repository_dispatch:
    types: [publish-notes]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      QUARTZ_BASE_URL: "https://lorite.github.io/lorite-personal-website-obsidian-quartz"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Checkout private notes repository
        uses: actions/checkout@v6
        with:
          repository: Lorite/lorite-obsidian-notes
          token: ${{ secrets.NOTES_REPO_TOKEN }}
          path: notes-repo
      - name: Sync published notes to content
        run: npm run sync:published -- --source "notes-repo" --dest "content"
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
