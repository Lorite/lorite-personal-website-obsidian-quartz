name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  repository_dispatch:
    types: [publish-notes]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      QUARTZ_BASE_URL: "https://lorite.github.io/lorite-personal-website-obsidian-quartz"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      # Quartz v5: cache and install the community plugins before building.
      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      # --from-config is required: quartz.lock.json records local ./local-plugins/* plugins by
      # absolute path from the machine that installed them, which doesn't exist on the runner.
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Checkout private notes repository
        uses: actions/checkout@v4
        with:
          repository: Lorite/lorite-obsidian-notes
          token: ${{ secrets.NOTES_REPO_TOKEN }}
          path: notes-repo
      - name: Sync published notes to content
        run: npm run sync:published -- --source "notes-repo" --dest "content"
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
